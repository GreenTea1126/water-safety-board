<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>수상안전팀 업무보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 팀 공용: 상단 현황 + 가로 3칸(할 일 | 달력 | 정기업무·유효기간). 좁은 화면에서는 세로로 쌓임 */
:root{
  --bg:#eef2f4; --panel:#ffffff; --sunk:#f4f7f8; --line:#d6dee2; --fg:#16232b; --muted:#5f707a;
  --accent:#0f6e86; --accent-fg:#ffffff; --accent-bg:#e2f1f5;
  --crit:#c7362f; --crit-bg:#fbe9e7; --warn:#b5650b; --warn-bg:#fdf1e1; --ok:#23855a; --chip:#e7edf0;
  --rec:#6b5bb5; --rec-bg:#eeebf8; --exp:#a3540c; --exp-bg:#fbeedd; --chk:#2a62b8; --chk-bg:#e6eefb; --wkend:#f7f9fa;
  --font-body:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0d171c; --panel:#142128; --sunk:#192a32; --line:#263a44; --fg:#e4edf0; --muted:#8ea2ab;
  --accent:#4cb4cf; --accent-fg:#06222b; --accent-bg:rgba(76,180,207,.15);
  --crit:#ff6b62; --crit-bg:rgba(255,107,98,.13); --warn:#f2a64a; --warn-bg:rgba(242,166,74,.12); --ok:#4cc58c; --chip:#203540;
  --rec:#a99bf0; --rec-bg:rgba(169,155,240,.14); --exp:#f0a868; --exp-bg:rgba(240,168,104,.14); --chk:#7fa8f0; --chk-bg:rgba(127,168,240,.15); --wkend:#111d23;
  color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;display:flex;flex-direction:column;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.brand{display:flex;flex-direction:column;gap:2px;min-width:150px}
.brand b{font-size:17px}
.brand span{font-size:13px;color:var(--muted)}
.clock{font-size:24px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;flex:1;min-width:0}
.kpi{border-top:3px solid var(--line);background:var(--sunk);padding:6px 12px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font-size:24px;font-weight:600}
.kpi.crit{border-top-color:var(--crit)} .kpi.crit .v{color:var(--crit)} .kpi.crit.on{background:var(--crit-bg)}
.kpi.warn{border-top-color:var(--warn)} .kpi.warn .v{color:var(--warn)}
.kpi.chk{border-top-color:var(--chk)} .kpi.chk .v{color:var(--chk)}
.kpi.exp{border-top-color:var(--exp)} .kpi.exp .v{color:var(--exp)}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tools select{background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;font-size:13.5px;color:var(--fg)}
.conn{font-size:12px;color:var(--muted);white-space:nowrap}
.conn.bad{color:var(--crit)}
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,.9fr);gap:14px;min-height:0;
  padding-block:14px 16px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.col{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-height:0;min-width:0}
.colhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.colhead h2{margin:0;font-size:16.5px;font-weight:700}
.colhead .sub{font-size:12px;color:var(--muted);margin-left:8px;font-weight:400}
.add{background:var(--accent);color:var(--accent-fg);border:none;border-radius:6px;padding:7px 12px;font-size:13.5px;font-weight:600;white-space:nowrap}
.add:hover{filter:brightness(1.08)}
.tabs{display:inline-flex;background:var(--chip);border-radius:7px;padding:3px}
.tabs button{border:none;background:none;padding:5px 12px;border-radius:5px;font-size:14px;color:var(--muted);font-weight:600}
.tabs button.on{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.list{flex:1;overflow-y:auto;padding:10px 12px 14px;display:flex;flex-direction:column;gap:7px}
.group{font-size:12px;color:var(--muted);margin:8px 4px 0;display:flex;justify-content:space-between}
.group:first-child{margin-top:0}
.item{display:flex;gap:10px;align-items:center;background:var(--sunk);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:6px;padding:9px 8px 9px 10px}
.item.over{border-left-color:var(--crit);background:var(--crit-bg)}
.item.soon{border-left-color:var(--warn);background:var(--warn-bg)}
.item.review{border-left-color:var(--chk);background:var(--chk-bg)}
.item.done{opacity:.5;border-left-color:var(--line)}
.item.done .title{text-decoration:line-through}
.chk{width:22px;height:22px;border-radius:5px;border:2px solid var(--muted);background:transparent;flex:none;display:grid;place-items:center;font-size:12px;padding:0;color:var(--accent-fg);font-weight:700}
.chk.on{background:var(--ok);border-color:var(--ok)}
.chk.half{background:var(--chk);border-color:var(--chk)}
.body{flex:1;min-width:0;cursor:pointer}
.title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:6px 8px;flex-wrap:wrap;align-items:center}
.tag{background:var(--chip);border-radius:4px;padding:1px 6px}
.tag.mw{background:var(--accent-bg);color:var(--accent);font-weight:600}
.tag.who{background:var(--panel);border:1px solid var(--line);color:var(--fg)}
.tag.ck{background:var(--chk-bg);color:var(--chk);font-weight:600}
.tag.ex{background:var(--exp-bg);color:var(--exp);font-weight:600}
.dday{font-size:15px;font-weight:600;min-width:60px;text-align:right;color:var(--muted)}
.over .dday{color:var(--crit)} .soon .dday{color:var(--warn)} .review .dday{color:var(--chk)}
.pen{background:none;border:none;color:var(--muted);font-size:14px;padding:4px 6px;border-radius:4px}
.pen:hover{color:var(--accent);background:var(--chip)}
.okbtn{background:var(--chk);color:#fff;border:none;border-radius:5px;padding:4px 8px;font-size:12px;font-weight:600;flex:none}
.notebtn{background:var(--accent-bg);border:none;color:var(--accent);font-size:12px;font-weight:600;padding:3px 7px;border-radius:4px;flex:none}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:22px 8px;line-height:1.6}
.toggle{font-size:12px;color:var(--muted);background:none;border:none;padding:4px 2px;text-align:left}
.toggle:hover{color:var(--accent)}
.calnav{display:flex;align-items:center;gap:6px}
.calnav .m{font-size:16.5px;font-weight:700;min-width:118px;text-align:center}
.nav{background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:14px}
.nav:hover{border-color:var(--accent)}
.legend{display:flex;gap:10px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.cal{flex:1;display:flex;flex-direction:column;padding:8px 10px 10px;min-height:0}
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-size:12px;color:var(--muted);text-align:center;padding-bottom:5px}
.dow span:first-child{color:var(--crit)}
.grid{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:4px;min-height:0}
.day{background:var(--sunk);border:1px solid var(--line);border-radius:5px;padding:4px 5px;display:flex;flex-direction:column;gap:2px;min-width:0;min-height:72px;overflow:hidden;text-align:left;font:inherit}
.day:hover{border-color:var(--accent)}
.day.wk{background:var(--wkend)} .day.out{opacity:.4}
.day.today{border:2px solid var(--accent);padding:3px 4px}
.day .dn{font-size:13px;font-weight:600;display:flex;justify-content:space-between;gap:4px}
.day .dn .hn{font-size:10.5px;font-weight:400;color:var(--crit)}
.day.hol .dn>span:first-child,.day.sun .dn>span:first-child{color:var(--crit)}
.ev{font-size:11.5px;line-height:1.35;border-radius:3px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--chip);color:var(--fg)}
.ev.mw{background:var(--accent-bg);color:var(--accent)}
.ev.rec{background:var(--rec-bg);color:var(--rec)}
.ev.exp{background:var(--exp-bg);color:var(--exp)}
.ev.review{background:var(--chk-bg);color:var(--chk)}
.ev.over{background:var(--crit-bg);color:var(--crit);font-weight:600}
.ev.done{text-decoration:line-through;opacity:.55}
.more{font-size:11px;color:var(--muted);padding-left:4px}
.back[hidden]{display:none}
.back{position:fixed;inset:0;background:rgba(5,15,20,.5);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;width:min(500px,100%);max-height:100%;overflow:auto}
.modal.wide{width:min(760px,100%)}
.modal h3{margin:0 0 14px;font-size:18px}
.seg{display:inline-flex;background:var(--chip);border-radius:7px;padding:3px;margin-bottom:14px}
.seg button{border:none;background:none;padding:6px 16px;border-radius:5px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
.f label,.f .lab{font-size:13px;color:var(--muted)}
.f input,.f select,.f textarea{background:var(--sunk);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-family:inherit;font-size:14px;width:100%}
.f textarea{min-height:56px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--muted);line-height:1.55}
.warnbox{font-size:12.5px;color:var(--crit);background:var(--crit-bg);border-radius:6px;padding:8px 10px;margin-bottom:10px;line-height:1.5}
.calc{font-size:13px;color:var(--accent);font-weight:600}
.checks{display:flex;flex-direction:column;gap:6px;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:10px}
.checks label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--fg)}
.log{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.6}
.mfoot{display:flex;justify-content:space-between;gap:8px;margin-top:16px;flex-wrap:wrap}
.mfoot .r,.mfoot .l{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:7px 12px;font-size:13.5px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.danger{color:var(--crit)}
.btn.danger.arm{background:var(--crit);border-color:var(--crit);color:#fff}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days label{display:flex;align-items:center;gap:3px;background:var(--chip);border-radius:5px;padding:4px 8px;color:var(--fg);font-size:13px;cursor:pointer}
.daylist{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.nlist{display:flex;flex-direction:column;gap:6px;max-height:55vh;overflow:auto;margin-top:10px}
.nitem{text-align:left;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font:inherit;color:var(--fg)}
.nitem:hover{border-color:var(--accent)}
.nitem .t{font-weight:600;font-size:15px;display:flex;gap:8px;align-items:center}
.nitem .p{font-size:12.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nbody{white-space:pre-wrap;word-break:break-word;font-size:15px;line-height:1.75;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:14px 16px;max-height:62vh;overflow:auto}
.nmeta{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:-6px 0 12px}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:7px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30;max-width:90vw}
.toast.show{opacity:1}
@media (max-width:1250px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){
  body{overflow:auto;display:block}
  main{grid-template-columns:minmax(0,1fr)}
  .list{overflow:visible}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));flex-basis:100%}
  .day{min-height:58px}
  .ev{font-size:10.5px;padding:0 3px}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style></head><body>

<header>
  <div class="brand"><b>수상안전팀 업무보드</b><span id="date"></span></div>
  <div class="clock num" id="time">--:--</div>
  <div class="kpis">
    <div class="kpi crit" id="k-over"><span class="l">기한 경과</span><span class="v num" id="v-over">–</span></div>
    <div class="kpi warn"><span class="l">오늘 마감</span><span class="v num" id="v-today">–</span></div>
    <div class="kpi warn"><span class="l">3일 이내</span><span class="v num" id="v-soon">–</span></div>
    <div class="kpi chk"><span class="l">확인 대기</span><span class="v num" id="v-chk">–</span></div>
    <div class="kpi exp"><span class="l">유효기간 안내 필요</span><span class="v num" id="v-exp">–</span></div>
  </div>
  <div class="tools">
    <span class="conn" id="conn">연결 중…</span>
    <label class="hint" for="who">보기</label><select id="who"></select>
    <button class="btn" id="ruleBtn">이용 규칙</button>
    <button class="btn" id="noteBtn">업무절차</button>
    <button class="btn" id="setBtn" hidden>설정</button>
  </div>
</header>

<main>
  <section class="col">
    <div class="colhead"><h2>할 일<span class="sub">민원·유효기간 안내 포함 · 마감 빠른 순</span></h2><button class="add" id="addTask">+ 추가</button></div>
    <div class="list" id="taskList"><div class="empty">불러오는 중…</div></div>
  </section>
  <section class="col">
    <div class="colhead">
      <div class="calnav"><button class="nav" id="prevM" aria-label="이전 달">‹</button><span class="m num" id="calTitle"></span><button class="nav" id="nextM" aria-label="다음 달">›</button><button class="nav" id="thisM">오늘</button></div>
      <div class="legend"><span><i style="background:var(--fg)"></i>할 일</span><span><i style="background:var(--accent)"></i>민원</span><span><i style="background:var(--rec)"></i>정기</span><span><i style="background:var(--exp)"></i>유효기간</span><span><i style="background:var(--chk)"></i>확인 대기</span><span><i style="background:var(--crit)"></i>기한 경과</span></div>
    </div>
    <div class="cal">
      <div class="dow"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
      <div class="grid" id="calGrid"></div>
    </div>
  </section>
  <section class="col">
    <div class="colhead"><div class="tabs" role="tablist"><button id="tabRec" class="on">정기업무</button><button id="tabExp">유효기간</button></div><button class="add" id="addRight">+ 정기</button></div>
    <div class="list" id="rightList"><div class="empty">불러오는 중…</div></div>
  </section>
</main>

<div class="back" id="back" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ============ 기본값 ============ */
const DEFAULT_AREAS=['하천점용허가','수상레저','유·도선','단속','선착장 민간위탁','선착장 시설보수','관공선','예산·회계·서무','기타'];
const DEFAULT_HOLIDAYS=['2026-01-01','2026-02-16','2026-02-17','2026-02-18','2026-03-02','2026-05-05','2026-05-25','2026-06-03','2026-08-17','2026-09-24','2026-09-25','2026-09-28','2026-10-05','2026-10-09','2026-12-25','2027-01-01','2027-02-08','2027-02-09','2027-03-01','2027-05-05','2027-05-13','2027-08-16','2027-09-14','2027-09-15','2027-09-16','2027-10-04','2027-10-11','2027-12-27'];
const EXP_KINDS=['수상레저사업 등록','하천점용허가','유·도선사업 면허','계약','기타'];
const EXP_STATUS=['안내 전','안내 완료','갱신 처리중','갱신 완료','종료'];
const HIDE_TODO_KINDS=['하천점용허가']; // 할 일·달력에는 올리지 않고 유효기간 탭에서만 관리
const EXP_CHECKS=['유효기간 산정 확인','구비서류 충족 확인','영업 실적·운영 여부 확인'];
const ST={tasks:[],recs:[],recdone:new Set(),notes:[],expiry:[],areas:DEFAULT_AREAS,members:[],holidays:DEFAULT_HOLIDAYS,lead:60,
  loaded:{tasks:false,recs:false,recdone:false,notes:false,expiry:false}};
let _w='all';try{_w=localStorage.getItem('team-board-who')||'all'}catch(e){}
const UI={who:_w,showDone:false,right:'rec',calY:new Date().getFullYear(),calM:new Date().getMonth()};
let db=null,user=null,me=null,isAdmin=false;

/* ============ 날짜 ============ */
const DOW=['일','월','화','수','목','금','토'];
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const todayStr=()=>fmt(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)};
const diff=s=>Math.round((parse(s)-parse(todayStr()))/86400000);
const isBiz=s=>{const w=parse(s).getDay();return w!==0&&w!==6&&!ST.holidays.includes(s)};
const prevBiz=s=>{let d=s;for(let i=0;i<15&&!isBiz(d);i++)d=addDays(d,-1);return d};
const short=s=>{const d=parse(s);return (d.getMonth()+1)+'/'+d.getDate()+'('+DOW[d.getDay()]+')'};
const ddayText=n=>n===0?'D-DAY':n>0?'D-'+n:'D+'+(-n);
const weekStart=s=>{const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return fmt(d)};
const lastDom=(y,m)=>new Date(y,m+1,0).getDate();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'');
const keep=o=>UI.who==='all'||o===UI.who||(UI.who==='__none'&&!o);
const keepTask=x=>UI.who==='all'||x.owner===UI.who||x.checker===UI.who||(UI.who==='__none'&&!x.owner);

/* ============ 개인정보 차단 ============ */
const PII=[[/(01[016789])[-.\s]?\d{3,4}[-.\s]?\d{4}/,'휴대전화 번호'],[/0\d{1,2}[-.\s]\d{3,4}[-.\s]\d{4}/,'전화번호'],[/\d{6}[-\s]?[1-8]\d{6}/,'주민등록번호'],[/[\w.+-]+@[\w-]+\.[\w.]+/,'이메일 주소']];
function piiCheck(...vals){const s=vals.join(' ');for(const [re,name] of PII)if(re.test(s))return name;return null}

/* ============ 유효기간 ============ */
function expNotice(x){if(!isDate(x.expire))return '';const lead=Number(x.lead)>0?Number(x.lead):ST.lead;return prevBiz(addDays(x.expire,-lead))}
// 할 일 목록에 끼워 넣을 유효기간 항목 (안내 전 → 안내일, 안내 완료·갱신중 → 만료일)
function expTodo(x){
  if(!isDate(x.expire)||x.archived)return null;
  if(x.status==='안내 전')return {due:expNotice(x),label:'갱신 안내'};
  if(x.status==='안내 완료'||x.status==='갱신 처리중')return {due:x.expire,label:'만료'};
  return null;
}

/* ============ 항목 모으기 ============ */
function workItems(){
  const a=ST.tasks.filter(x=>!x.archived&&(isDate(x.due)||!x.due)).filter(keepTask).map(x=>({kind:'task',id:x.id,x,title:x.title,due:x.due||'',done:!!x.done,review:!!x.review&&!x.done,doneAt:x.doneAt}));
  const b=ST.expiry.filter(x=>keep(x.owner)&&!HIDE_TODO_KINDS.includes(x.kind)).map(x=>{const t=expTodo(x);return t?{kind:'exp',id:x.id,x,title:'['+t.label+'] '+x.title,due:t.due,done:false,review:false}:null}).filter(Boolean);
  return [...a,...b].sort((p,q)=>(p.due||'9999').localeCompare(q.due||'9999')||((q.x.pri==='높음')-(p.x.pri==='높음')));
}
function recOccur(from,to){
  const out=[];
  ST.recs.filter(r=>!r.archived&&keep(r.owner)).forEach(r=>{
    if(r.type==='week'){
      const dws=Array.isArray(r.dows)&&r.dows.length?r.dows:[1];
      for(let d=from;d<=to;d=addDays(d,1)){if(dws.includes(parse(d).getDay())){const key=r.id+'~'+d;out.push({r,due:d,key,done:ST.recdone.has(key)})}}
    }else{
      let y=parse(from).getFullYear(),m=parse(from).getMonth()-1;if(m<0){m=11;y--}
      for(let i=0;i<4;i++){
        const dd=Number(r.dom)===0?lastDom(y,m):Math.min(Number(r.dom)||1,lastDom(y,m));
        const base=y+'-'+pad(m+1)+'-'+pad(dd);
        let due=base;if(!isBiz(due)&&r.shift==='first')due=base.slice(0,8)+'01';for(let k=0;k<15&&!isBiz(due);k++)due=addDays(due,1);
        if(due>=from&&due<=to){const key=r.id+'~'+base.slice(0,7);out.push({r,due,key,done:ST.recdone.has(key),moved:due!==base})}
        m++;if(m>11){m=0;y++}
      }
    }
  });
  return out.sort((a,b)=>a.done-b.done||a.due.localeCompare(b.due));
}

/* ============ 렌더 ============ */
const whoTag=x=>{let s='';if(x.owner)s+=`<span class="tag who">담당 ${esc(x.owner)}</span>`;if(x.checker)s+=`<span class="tag ck">확인 ${esc(x.checker)}</span>`;return s};
function stateCls(o){if(o.done)return 'done';if(o.review)return 'review';if(!o.due)return 'ok';const n=diff(o.due);return n<0?'over':n<=3?'soon':'ok'}
function itemHTML(o){
  const nd=!o.due,n=nd?null:diff(o.due);
  return `<div class="item ${stateCls(o)}">
    <button class="chk ${o.done?'on':o.review?'half':''}" aria-label="${o.review?'확인 대기 해제':'처리 완료 표시'}" data-act="toggle" data-kind="${o.kind}" data-id="${esc(o.id)}">${o.done?'✓':o.review?'…':''}</button>
    <div class="body" data-act="edit" data-kind="${o.editKind||o.kind}" data-id="${esc(o.editId||o.id)}">
      <div class="title" title="${esc(o.title)}">${esc(o.title)}</div>
      <div class="meta">${o.tags||''}${nd?'<span>기한 없음</span>':`<span class="num">${short(o.due)}</span>`}${o.extra||''}</div>
    </div>
    ${o.review?`<button class="okbtn" data-act="confirm" data-id="${esc(o.id)}" aria-label="확인 완료">확인</button>`:''}
    ${o.noteId?`<button class="notebtn" data-act="note" data-id="${esc(o.noteId)}">업무절차</button>`:''}
    <div class="dday num">${o.done?'완료':o.review?'확인 대기':nd?'—':ddayText(n)}</div>
    <button class="pen" aria-label="수정" data-act="edit" data-kind="${o.editKind||o.kind}" data-id="${esc(o.editId||o.id)}">✎</button>
  </div>`;
}
function noteFor(t){
  if(!t)return null;
  const n=ST.notes.find(n=>!n.archived&&String(n.keys||n.title||'').split(',').map(s=>s.trim()).filter(s=>s.length>=2).some(k=>t.includes(k)));
  return n?n.id:null;
}
function workHTML(w){
  const x=w.x;
  if(w.kind==='exp')return itemHTML({kind:'exp',id:w.id,title:w.title,due:w.due,done:false,noteId:noteFor(x.title),
    tags:`<span class="tag ex">${esc(x.kind||'유효기간')} · ${esc(x.status)}</span>`+whoTag(x),extra:`<span>만료 ${short(x.expire)}</span>`});
  const mw=x.type==='mw';
  return itemHTML({kind:'task',id:w.id,title:(x.pri==='높음'&&!w.done?'★ ':'')+x.title,due:w.due,done:w.done,review:w.review,noteId:noteFor(x.title),
    tags:(mw?`<span class="tag mw">민원${x.no?' '+esc(x.no):''}</span>`:'')+(x.area?`<span class="tag">${esc(x.area)}</span>`:'')+whoTag(x),
    extra:w.done?(x.doneAt?`<span>완료 ${short(x.doneAt)}</span>`:''):(x.memo?`<span>· ${esc(x.memo)}</span>`:'')});
}
function recHTML(o,label){return itemHTML({kind:'rec',id:o.key,editKind:'recdef',editId:o.r.id,title:o.r.title,due:o.due,done:o.done,noteId:noteFor(o.r.title),
  tags:(o.r.area?`<span class="tag">${esc(o.r.area)}</span>`:'')+whoTag(o.r),extra:`<span>${label}</span>${o.r.memo?`<span>· ${esc(o.r.memo)}</span>`:''}`})}
function expRowHTML(x){
  const t=expTodo(x),due=t?t.due:x.expire;
  return itemHTML({kind:'exp',id:x.id,title:x.title,due:due||'',done:x.status==='갱신 완료'||x.status==='종료',noteId:noteFor(x.title),
    tags:`<span class="tag ex">${esc(x.kind||'유효기간')} · ${esc(x.status)}</span>`+whoTag(x),
    extra:`<span>만료 ${isDate(x.expire)?short(x.expire):'-'}${x.status==='안내 전'&&t?' · 안내일 '+short(t.due):''}</span>`});
}

function render(){
  const ready=ST.loaded.tasks&&ST.loaded.expiry;
  const all=workItems(),open=all.filter(x=>!x.done),done=all.filter(x=>x.done).sort((a,b)=>(b.doneAt||'').localeCompare(a.doneAt||''));
  if(ready){
    let h='';
    if(!open.length)h+='<div class="empty">남은 할 일이 없어요.<br>+ 추가에서 할 일이나 민원을 넣으세요. 달력의 날짜를 눌러도 추가할 수 있어요.</div>';
    const rv=open.filter(x=>x.review);
    if(rv.length){h+=`<div class="group"><span>확인 대기 · 확인자가 체크해야 완료돼요</span><span class="num">${rv.length}</span></div>`;rv.forEach(x=>h+=workHTML(x))}
    const rest=open.filter(x=>!x.review);
    [['기한 경과',x=>x.due&&diff(x.due)<0],['오늘',x=>x.due&&diff(x.due)===0],['7일 이내',x=>x.due&&diff(x.due)>0&&diff(x.due)<=7],['이후',x=>x.due&&diff(x.due)>7],['기한 없음 · 신경 쓸 것',x=>!x.due]].forEach(([name,f])=>{
      const g=rest.filter(f);if(!g.length)return;
      h+=`<div class="group"><span>${name}</span><span class="num">${g.length}</span></div>`;g.forEach(x=>h+=workHTML(x));
    });
    h+=`<button class="toggle" data-act="showDone">${UI.showDone?'▾':'▸'} 완료 ${done.length}건</button>`;
    if(UI.showDone)done.slice(0,30).forEach(x=>h+=workHTML(x));
    document.getElementById('taskList').innerHTML=h;
  }
  const t=todayStr(),ws=weekStart(t),we=addDays(ws,6),now=parse(t);
  const ms=t.slice(0,8)+'01',me_=t.slice(0,8)+pad(lastDom(now.getFullYear(),now.getMonth()));
  const wk=recOccur(ws,we).filter(x=>x.r.type==='week'),mo=recOccur(ms,me_).filter(x=>x.r.type==='month');
  const wl=wk.filter(x=>!x.done).length,ml=mo.filter(x=>!x.done).length;
  const rl=document.getElementById('rightList');
  if(UI.right==='rec'&&ST.loaded.recs){
    let h=`<div class="group"><span>이번 주 · ${short(ws)} ~ ${short(we)}</span><span>남음 <span class="num">${wl}</span></span></div>`;
    if(!wk.length)h+='<div class="empty">매주 하는 업무가 없어요.</div>';
    wk.forEach(x=>h+=recHTML(x,'매주 '+DOW[parse(x.due).getDay()]));
    h+=`<div class="group"><span>이번 달 · ${now.getMonth()+1}월</span><span>남음 <span class="num">${ml}</span></span></div>`;
    if(!mo.length)h+='<div class="empty">매월 하는 업무가 없어요.</div>';
    mo.forEach(x=>h+=recHTML(x,'매월 '+(Number(x.r.dom)===0?'말일':x.r.dom+'일')+(x.moved?(x.r.shift==='first'?' → 휴일이라 앞당김':' → 휴일이라 미룸'):'')));
    rl.innerHTML=h;
  }else if(UI.right==='exp'&&ST.loaded.expiry){
    const list=ST.expiry.filter(x=>!x.archived&&keep(x.owner));
    const act=list.filter(x=>expTodo(x)).sort((a,b)=>expTodo(a).due.localeCompare(expTodo(b).due));
    const fin=list.filter(x=>!expTodo(x)).sort((a,b)=>(a.expire||'').localeCompare(b.expire||''));
    let h=`<div class="hint" style="padding:0 4px 4px">만료 <b>${ST.lead}일</b> 전(근무일 기준)이 안내일이에요. 안내일이 되면 할 일 목록에 자동으로 올라와요(하천점용허가는 이 탭에서만 보여요).</div>`;
    h+=`<div class="group"><span>관리 중</span><span class="num">${act.length}</span></div>`;
    if(!act.length)h+='<div class="empty">관리 중인 유효기간이 없어요.<br>+ 유효기간에서 등록·허가를 넣으세요.</div>';
    act.forEach(x=>h+=expRowHTML(x));
    if(fin.length){h+=`<div class="group"><span>갱신 완료 · 종료</span><span class="num">${fin.length}</span></div>`;fin.forEach(x=>h+=expRowHTML(x))}
    rl.innerHTML=h;
  }
  renderCal(all);
  if(ready&&ST.loaded.recs){
    const dues=[...open.filter(x=>x.due&&!x.review).map(x=>x.due),...wk.filter(x=>!x.done).map(x=>x.due),...mo.filter(x=>!x.done).map(x=>x.due)];
    const over=dues.filter(d=>diff(d)<0).length;
    document.getElementById('v-over').textContent=over;
    document.getElementById('k-over').classList.toggle('on',over>0);
    document.getElementById('v-today').textContent=dues.filter(d=>diff(d)===0).length;
    document.getElementById('v-soon').textContent=dues.filter(d=>diff(d)>0&&diff(d)<=3).length;
    document.getElementById('v-chk').textContent=open.filter(x=>x.review).length;
    document.getElementById('v-exp').textContent=ST.expiry.filter(x=>!x.archived&&keep(x.owner)&&x.status==='안내 전'&&isDate(x.expire)&&diff(expNotice(x))<=0).length;
  }
}
function dayEvents(all,recs,d){
  const ev=[];
  all.filter(x=>x.due===d).forEach(x=>ev.push({type:x.kind==='exp'?'exp':x.review?'review':x.x.type==='mw'?'mw':'',title:x.title,done:x.done,over:!x.done&&!x.review&&diff(d)<0}));
  recs.filter(x=>x.due===d).forEach(x=>ev.push({type:'rec',title:x.r.title,done:x.done,over:!x.done&&diff(d)<0}));
  return ev.sort((a,b)=>a.done-b.done);
}
function renderCal(all){
  const y=UI.calY,m=UI.calM;
  document.getElementById('calTitle').textContent=y+'년 '+(m+1)+'월';
  const first=new Date(y,m,1),start=fmt(new Date(y,m,1-first.getDay()));
  const weeks=Math.ceil((first.getDay()+lastDom(y,m))/7),end=addDays(start,weeks*7-1);
  const recs=recOccur(start,end),t=todayStr(),cells=[];
  for(let i=0;i<weeks*7;i++){
    const d=addDays(start,i),dt=parse(d),w=dt.getDay(),hol=ST.holidays.includes(d);
    const ev=dayEvents(all,recs,d),shown=ev.slice(0,3);
    const c=['day',dt.getMonth()!==m?'out':'',w===0||w===6?'wk':'',w===0?'sun':'',hol?'hol':'',d===t?'today':''].join(' ');
    cells.push(`<button class="${c}" data-act="day" data-date="${d}" aria-label="${d} 일정 ${ev.length}건">
      <span class="dn"><span class="num">${dt.getDate()}</span>${hol?'<span class="hn">공휴일</span>':''}</span>
      ${shown.map(e=>`<span class="ev ${e.type} ${e.over?'over':''} ${e.done?'done':''}">${esc(e.title)}</span>`).join('')}
      ${ev.length>3?`<span class="more">+${ev.length-3}건</span>`:''}
    </button>`);
  }
  document.getElementById('calGrid').innerHTML=cells.join('');
}
function renderWho(){
  const s=document.getElementById('who');
  const opts=[['all','팀 전체'],...ST.members.map(n=>[n,n]),['__none','담당자 없음']];
  if(!opts.some(o=>o[0]===UI.who))UI.who='all';
  s.innerHTML=opts.map(([v,l])=>`<option value="${esc(v)}" ${v===UI.who?'selected':''}>${esc(l)}</option>`).join('');
}

/* ============ 저장소 ============ */
let toastT;function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),2800)}
function setConn(text,bad){const c=document.getElementById('conn');c.textContent=text;c.classList.toggle('bad',!!bad)}
async function write(fn,okMsg){
  if(!db){toast('저장소에 연결되지 않아 저장할 수 없어요');return false}
  try{await fn();if(okMsg)toast(okMsg);return true}
  catch(e){
    if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,700));try{await fn();if(okMsg)toast(okMsg);return true}catch(e2){}}
    toast(e&&e.code==='permission_denied'?'이 작업을 할 권한이 없어요. 보드 관리자에게 문의하세요.':e&&e.code==='quota_exceeded'?'저장 공간이 가득 찼어요.':'저장하지 못했어요. 잠시 후 다시 시도해 주세요.');return false;
  }
}
const newId=p=>(p||'')+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const stamp=()=>({updatedBy:me,updatedAt:todayStr()});

async function start(){
  try{user=await claude.use('user')}catch(e){user=null}
  if(user){try{isAdmin=!!user.isOwner()}catch(e){isAdmin=false}try{me=await user.id()}catch(e){me=null}}
  document.getElementById('setBtn').hidden=!isAdmin;
  let ns=null;
  try{ns=await claude.use('db')}catch(e){ns=null}
  if(!ns){setConn('저장소에 연결할 수 없음',true);['taskList','rightList'].forEach(id=>document.getElementById(id).innerHTML='<div class="empty">데이터를 불러올 수 없어요.<br>claude.ai에 로그인한 상태로 열어 주세요.</div>');return}
  db=ns;
  let confirmed=0;const need=6;
  const timer=setTimeout(()=>{if(confirmed<need)setConn('연결 지연 · 최신이 아닐 수 있음',true)},10000);
  const mark=()=>{confirmed++;if(confirmed>=need){clearTimeout(timer);setConn('실시간 연결됨')}};
  const fail=()=>{clearTimeout(timer);setConn('연결 끊김 · 새로고침 필요',true)};
  const sub=(name,map)=>{let first=true;db.collection(name).onSnapshot(s=>{ST[name]=map(s);ST.loaded[name]=true;if(first&&!s.metadata.fromCache){first=false;mark()}render()},fail)};
  const docs=s=>s.docs.map(d=>({id:d.id,...d.data()}));
  sub('tasks',docs);sub('recs',docs);sub('notes',docs);sub('expiry',docs);
  sub('recdone',s=>new Set(s.docs.map(d=>d.id)));
  let firstCfg=true;
  db.doc('config/settings').onSnapshot(s=>{
    const d=s.exists?s.data():null;
    ST.areas=d&&Array.isArray(d.areas)&&d.areas.length?d.areas:DEFAULT_AREAS;
    ST.members=d&&Array.isArray(d.members)?d.members:[];
    ST.holidays=d&&Array.isArray(d.holidays)?d.holidays:DEFAULT_HOLIDAYS;
    ST.lead=d&&Number(d.lead)>0?Number(d.lead):60;
    if(firstCfg&&!s.metadata.fromCache){firstCfg=false;mark()}
    renderWho();render();
  },fail);
}
async function nameOf(id){
  if(!id)return '';
  if(id===me)return '나';
  try{const ps=await user.profiles([id]);return (ps[id]&&ps[id].name)||'팀원'}catch(e){return '팀원'}
}
async function fillLog(x){
  const el=document.getElementById('log');if(!el||!x)return;
  const parts=[];
  if(x.createdBy)parts.push('작성 '+await nameOf(x.createdBy)+(x.createdAt?' '+short(x.createdAt):''));
  if(x.updatedBy)parts.push('최근 수정 '+await nameOf(x.updatedBy)+(x.updatedAt?' '+short(x.updatedAt):''));
  if(x.reviewBy)parts.push('처리 '+await nameOf(x.reviewBy));
  if(x.checkedBy)parts.push('확인 '+await nameOf(x.checkedBy));
  el.textContent=parts.join(' · ');
}

function noteMatch(n,q){if(!q)return true;const s=[n.title,n.area,n.keys,n.body].join(' ').toLowerCase();return q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>s.includes(w))}
function noteListHTML(q){
  const live=ST.notes.filter(n=>!n.archived);
  const list=live.filter(n=>noteMatch(n,q)).sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||'')||String(a.title).localeCompare(String(b.title)));
  if(!live.length)return '<div class="empty">아직 저장된 업무절차가 없어요.<br>+ 새 업무절차에 가끔 하는 업무의 처리 순서를 적어두세요.</div>';
  if(!list.length)return '<div class="empty">“'+esc(q)+'”에 맞는 업무절차가 없어요.</div>';
  return list.map(n=>`<button class="nitem" data-act="note" data-id="${esc(n.id)}"><div class="t">${esc(n.title)}${n.area?`<span class="tag">${esc(n.area)}</span>`:''}</div><div class="p">${esc(String(n.body||'').replace(/\s+/g,' ').slice(0,120))}</div></button>`).join('');
}

 ['설정은 관리자만','팀원 명단, 공휴일, 유효기간 안내 시점 변경은 관리자에게 요청해요.'],
 ['보드 화면은 수정하지 않기','편집자 권한이 있어도 보드 화면(코드)을 고치거나 다시 올리지 않아요. 개선 의견은 관리자에게 알려 주세요.'],
 ['링크 공유 금지','보드 링크는 팀 밖으로 보내지 않아요. 새 팀원 추가는 관리자가 해요.'],
 ['업무절차 남기기','가끔 하는 업무는 처리한 뒤 [업무절차]에 순서를 남겨 다음 사람이 따라 할 수 있게 해요.']];
function openRules(first){
  show(`<h3>수상안전팀 업무보드 이용 규칙</h3>
  ${first?'<div class="hint" style="margin:-6px 0 12px">처음 오셨네요. 함께 쓰는 보드라 아래 규칙을 지켜 주세요.</div>':''}
  <ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:9px;line-height:1.55">${RULES.map(([t,b])=>`<li><b>${t}</b><br><span class="hint" style="font-size:13.5px;color:var(--fg)">${b}</span></li>`).join('')}</ol>
  <div class="mfoot"><div></div><div class="r"><button class="btn primary" data-close>${first?'확인했어요':'닫기'}</button></div></div>`);
  if(first){try{localStorage.setItem('team-board-rules','1')}catch(e){}}
}
document.getElementById('ruleBtn').onclick=()=>openRules(false);

/* ============ 클릭 처리 ============ */
const COL={task:'tasks',exp:'expiry',rec:'recs',note:'notes'};
document.addEventListener('click',async e=>{
  if(e.target.closest('[data-close]')){closeModal();return}
  const arch=e.target.closest('#archBtn');
  if(arch){const {kind,id}=arch.dataset;if(await write(()=>db.doc(COL[kind]+'/'+id).update({archived:true,...stamp()}),'보관했어요. 목록에서 숨겨져요'))closeModal();return}
  const del=e.target.closest('#delBtn');
  if(del){
    if(!del.classList.contains('arm')){del.classList.add('arm');del.textContent='한 번 더 누르면 완전 삭제';return}
    const {kind,id}=del.dataset;
    if(await write(()=>db.doc(COL[kind]+'/'+id).delete(),'삭제했어요'))closeModal();
    return;
  }
  const t=e.target.closest('[data-act]');if(!t)return;
  const {act,kind,id}=t.dataset;
  const inDay=!back.hidden&&modal.querySelector('.daylist');
  if(act==='day'){openDay(t.dataset.date);return}
  if(act==='note'){openNote(id);return}
  if(act==='showDone'){UI.showDone=!UI.showDone;render();return}
  if(act==='edit'){if(kind==='task')openTask(id);else if(kind==='exp')openExp(id);else if(kind==='recdef')openRec(id);return}
  if(act==='confirm'){
    const x=ST.tasks.find(v=>v.id===id);if(!x)return;
    await write(()=>db.doc('tasks/'+id).update({done:true,doneAt:todayStr(),checkedBy:me,...stamp()}),'확인 완료');
    if(inDay&&UI.dayOpen)openDay(UI.dayOpen);return;
  }
  if(act==='toggle'){
    if(kind==='rec'){
      const [rid,period]=id.split('~');
      if(ST.recdone.has(id))await write(()=>db.doc('recdone/'+id).delete());else await write(()=>db.doc('recdone/'+id).set({rec:rid,period,at:todayStr(),by:me}));
    }else if(kind==='exp'){
      const x=ST.expiry.find(v=>v.id===id);if(!x)return;
      const next={'안내 전':'안내 완료','안내 완료':'갱신 처리중','갱신 처리중':'갱신 처리중'}[x.status];
      if(!next){openExp(id);return}
      if(x.status==='갱신 처리중'){toast('갱신 완료는 점검 항목을 체크한 뒤 수정 창에서 바꿔 주세요');openExp(id);return}
      await write(()=>db.doc('expiry/'+id).update({status:next,...stamp()}),'“'+next+'”(으)로 바꿨어요');
    }else{
      const x=ST.tasks.find(v=>v.id===id);if(!x)return;
      let d;
      if(x.done||x.review)d={done:false,review:false,doneAt:null,reviewBy:null,checkedBy:null};
      else if(x.checker)d={review:true,reviewBy:me};
      else d={done:true,doneAt:todayStr(),reviewBy:me};
      await write(()=>db.doc('tasks/'+id).update({...d,...stamp()}),d.review?'확인 대기로 넘겼어요 · 확인자: '+x.checker:null);
    }
    if(inDay&&UI.dayOpen)openDay(UI.dayOpen);
  }
});
document.getElementById('addTask').onclick=()=>openTask(null,null,'task');
document.getElementById('addRight').onclick=()=>UI.right==='rec'?openRec():openExp();
document.getElementById('setBtn').onclick=()=>openSettings();
document.getElementById('noteBtn').onclick=()=>openNotes();
function setRight(r){UI.right=r;document.getElementById('tabRec').classList.toggle('on',r==='rec');document.getElementById('tabExp').classList.toggle('on',r==='exp');document.getElementById('addRight').textContent=r==='rec'?'+ 정기':'+ 유효기간';render()}
document.getElementById('tabRec').onclick=()=>setRight('rec');
document.getElementById('tabExp').onclick=()=>setRight('exp');
document.getElementById('who').addEventListener('change',e=>{UI.who=e.target.value;try{localStorage.setItem('team-board-who',UI.who)}catch(err){}render()});
document.getElementById('prevM').onclick=()=>{UI.calM--;if(UI.calM<0){UI.calM=11;UI.calY--}render()};
document.getElementById('nextM').onclick=()=>{UI.calM++;if(UI.calM>11){UI.calM=0;UI.calY++}render()};
document.getElementById('thisM').onclick=()=>{const n=new Date();UI.calY=n.getFullYear();UI.calM=n.getMonth();render()};
document.addEventListener('keydown',e=>{
  if(back.hidden)return;
  if(e.key==='Escape')closeModal();
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){const b=document.getElementById('saveBtn');b&&b.click()}
});
let lastDay='';
function tick(){
  const n=new Date();
  document.getElementById('time').textContent=pad(n.getHours())+':'+pad(n.getMinutes());
  document.getElementById('date').textContent=n.getFullYear()+'년 '+(n.getMonth()+1)+'월 '+n.getDate()+'일 ('+DOW[n.getDay()]+')';
  const d=todayStr();if(d!==lastDay){lastDay=d;render()}
}
renderWho();tick();setInterval(tick,15000);
let _seen=null;try{_seen=localStorage.getItem('team-board-rules')}catch(e){_seen='1'}
if(!_seen)setTimeout(()=>openRules(true),600);
start();
</script>
</body></html>
